<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Paws</title>
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/layout.css">
  <link rel="stylesheet" href="/src/styles/layouts.css">
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="./landing.css">
  <link rel="stylesheet" href="../../components/footer/footer.css">
</head>

<body>

  <div class="resp">

    <aside class="sidebar">
      <script
        type="module"
        src="/src/components/sidebar/sidebar-loader.js"
      ></script>
      <span class="theme-button">
        <script
          type="module"
          src="/src/components/accessibility-practices/lightdark.js"
        ></script>
      </span>
    </aside>

    <!-- HEADER COMPONENT -->
    <script type="module" src="/src/components/Header/header-loader.js"></script>

    <div class="hero-section">
      <div class="hero-text">
        <br> <span>Where you find your new best friend</span>
      </div>
      <img src="/src/assets/icons/womanandpets.png" alt="Imagem principal" class="hero-image">
      <a href="src/pages/Gallery/gallery.html" class="rounded-button">I want to adopt</a>
    </div>

    <div class="list1">
      <br> <span>We are an animal shelter dedicated to rescuing, caring for, and rehoming pets in need. Our mission is to
        save lives.</span>
    </div>

    <!-- Combined Urgent Adoptions Section -->
    <section class="urgent-adoptions-section">
      <div class="urgent-adoptions-header">
        <h2 class="urgent-carousel-title">Urgent Adoptions</h2>
        
        <!-- CATEGORY FILTERS -->
        <section class="category-filters">
          <button class="chip chip--active fixed-all">All</button>
          <button class="chip dog">
            <img src="../../assets/icons/dog.svg"  alt="Dogs">
            Dogs
            </button>
          <button class="chip cat">
            <img src="../../assets/icons/cat.svg" alt="Cats">
            Cats
          </button>
          <button class="chip rabbit">
            <img src="../../assets/icons/rabbit.svg" alt="Rabbits">
            Rabbits
          </button>
          <button class="chip bird">
            <img src="../../assets/icons/bird.svg" alt="Birds">
            Birds
          </button>
        </section>
      </div>

      <!-- Carousel -->
      <div class="carousel-wrapper">
        <button class="scroll-btn scroll-btn-left" id="scrollLeft">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="urgent-carousel-container"></div>
        <button class="scroll-btn scroll-btn-right" id="scrollRight">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <script type="module" src="./urgent-carousel.js"></script>
    </section>
  </div>

  <div class="footero">
    <footer>
      <script
        type="module"
        src="/src/components/footer/footer-loader.js"
      ></script>
    </footer>
  </div>

  <script type="module" src="./landing.js"></script>
</body>

</html>

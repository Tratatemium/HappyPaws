<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script type="module" crossorigin src="/HappyPaws/assets/chat-Uh9_dWtc.js"></script>
  <link rel="modulepreload" crossorigin href="/HappyPaws/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/HappyPaws/assets/footer-loader-Bpclrq5y.js">
  <link rel="stylesheet" crossorigin href="/HappyPaws/assets/footer-loader-CX7JdYpq.css">
  <link rel="stylesheet" crossorigin href="/HappyPaws/assets/chat-B_MKLknm.css">
  <link rel="stylesheet" crossorigin href="/HappyPaws/assets/variables-DpSl2oTU.css">
</head>

<body>

  <div class="chat-wrapper">
    <div class="chat-header">

      <div class="buttons-wrapper">
        <i id="call-icon" class="fa-solid fa-phone"></i>
        <i id="menu-option" class="fa-solid fa-ellipsis-vertical"></i>
      </div>

      <div class="user">
        <i id="back-icon" class="fa-solid fa-chevron-right"></i>
        <div class="user-info">  
          <img src="https://cdn.pixabay.com/photo/2016/09/24/03/20/man-1690965_1280.jpg" width="40rem" alt="user-picture"/>
          <p>Sam</p>
        </div>    
       </div>

    </div>
  
    <div class="chat-box">
    
    </div>


    <div class="chat-footer">
    
      <input id="msg-input" type="text" placeholder="Type a message..."/>
        <i id="send-btn" class="fa-solid fa-paper-plane"></i>

    </div>

    

  </div>

  <footer></footer>

</body>
</html>

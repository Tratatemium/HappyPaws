<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Detail — Happy Paws</title>
  <link rel="stylesheet" href="../../styles/reset.css" />
  <link rel="stylesheet" href="../../styles/layout.css" />
  <link rel="stylesheet" href="../../styles/layouts.css" />
  <link rel="stylesheet" href="../../styles/variables.css" />
  <link rel="stylesheet" href="./pet-card-detail.css" />
</head>
<body>
  <!-- HEADER COMPONENT -->
  <script type="module" src="../../components/Header/header-loader.js"></script>

  <!-- MAIN CONTENT -->
  <main class="pet-detail-page">
    <div class="resp">
      <aside class="sidebar">
        <script type="module" src="../../components/sidebar/sidebar-loader.js"></script>
      </aside>

      <!-- PET DETAIL CONTAINER -->
      <div class="pet-detail-container">
        <!-- Gallery Section -->
        <section class="pet-gallery-section">
          <div class="pet-gallery-container"></div>
        </section>

        <!-- Details Section -->
        <section class="pet-details-section">
          <!-- Header with name and favorite button -->
          <section class="pet-detail-header"></section>

          <!-- Story Section -->
          <section class="pet-detail-story"></section>

          <!-- Traits Section -->
          <section class="pet-detail-traits"></section>

          <!-- Health & Care Section -->
          <section class="pet-detail-health"></section>

          <!-- Urgent Reason (if applicable) -->
          <section class="pet-detail-urgent"></section>
        </section>
      </div>
    </div>
  </main>

  <div class="footero">
    <footer></footer>
    <script type="module" src="../../components/Footer/footer-loader.js"></script>
  </div>

  <!-- PAGE JS -->
  <script type="module" src="./pet-card-detail.js"></script>
</body>
</html>
